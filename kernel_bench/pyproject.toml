[project]
name = "kernel-bench"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "torch==2.8.0",
    "numpy>=2.3.4",
    "transformers==4.55",
    "accelerate>=1.11.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true